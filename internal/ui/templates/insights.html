<!DOCTYPE html>
<html>
<head><title>ARGUS Insights</title></head>
<body>
<h1>Insights</h1>
<table border="1">
<tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Agent</th></tr>
{{range .Tasks}}
<tr>
<td>{{.ID}}</td><td>{{.Title}}</td><td>{{.Status}}</td><td>{{.Priority}}</td><td>{{.CurrentAgent}}</td>
</tr>
{{end}}
</table>
<h2>Epistemic State</h2>
<table border="1">
<tr><th>ID</th><th>Claim</th><th>Status</th><th>Debt</th></tr>
{{range .Beliefs}}
<tr>
<td>{{.ID}}</td><td>{{.Claim}}</td><td>{{.Status}}</td><td>{{.Debt}}</td>
</tr>
{{end}}
</table>
</body>
</html>
